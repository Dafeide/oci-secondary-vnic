    - reject(geosite:rarbg)
    - reject(geosite:piratebay)
    - reject(geosite:1337x)
    - reject(geosite:nyaa)
    - reject(geosite:rutracker)
    - reject(geosite:btdig)
    - reject(geosite:bttzyw)
    - reject(geosite:xunlei)
