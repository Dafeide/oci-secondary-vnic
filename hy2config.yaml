    - reject(172.16.0.0/12)
    - reject(192.168.0.0/16)
    - reject(127.0.0.0/8)
    - reject(fc00::/7)
    - reject(all, */23)
    - reject(all, */24)
    - reject(all, */25) #acl规则自行查阅hysteria2文档
    - reject(all, */107)
    - reject(all, */194)
    - reject(all, */445)
    - reject(all, */465)
    - reject(all, */587)
    - reject(all, */992)
    - reject(all, */3389)
